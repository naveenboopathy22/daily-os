<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailU-Os</title>
<meta name="description" content="My daily plan, reminders, food and money in one place.">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Midnight & Champagne */
  --bg:#f6f3ec; --card:#fffdf9; --ink:#14161c; --muted:#6f6a60; --line:#e8e1d3;
  --accent:#1c2541; --on-accent:#f6f3ec; --accent-soft:#e8e9ef;
  --gold:#b08d4a; --gold-soft:#f3ead7; --gold-ink:#7a5f28;
  --warn:#b0702a; --bad:#a63d40; --good:#3d7a5a;
  --shadow:0 1px 2px rgba(20,22,28,.04),0 8px 24px rgba(20,22,28,.05);
  --radius:18px;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Inter",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --sf-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","Inter",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --sf-rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c0e13; --card:#151821; --ink:#f1ede4; --muted:#9b968b; --line:#252a36;
    --accent:#d6b56d; --on-accent:#14161c; --accent-soft:#2a2619;
    --gold:#d6b56d; --gold-soft:#2a2619; --gold-ink:#e6cb8e;
    --warn:#e0a35e; --bad:#e2787a; --good:#7cc49b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--sf);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:var(--sf-display);font-size:34px;line-height:41px;font-weight:700;margin:2px 0 4px;letter-spacing:.37px}
h2{font-family:var(--sf-display);font-size:20px;line-height:25px;font-weight:600;margin:0 0 10px;letter-spacing:.38px}
h3{font-size:15px;font-weight:600;margin:14px 0 6px;letter-spacing:-.24px;color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:-.08px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px;line-height:18px;letter-spacing:-.08px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-family:var(--sf-rounded);font-weight:700;letter-spacing:.35px;color:var(--gold-ink)}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-ink));border-radius:99px;transition:width .3s}
.bar.over i{background:var(--warn)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .time{width:48px;flex:none;color:var(--muted);font-size:13px;padding-top:3px;font-variant-numeric:tabular-nums}
.task .body{flex:1;min-width:0}
.task .title{font-weight:600;letter-spacing:-.41px}
.task .detail{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-line}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:transparent;font-size:15px;padding:0}
.task.done .check{background:var(--gold);border-color:var(--gold);color:var(--card)}
.xp{font-size:12px;color:var(--gold-ink);font-weight:600;white-space:nowrap;padding-top:4px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;letter-spacing:-.41px}
button.ghost{background:var(--accent-soft);color:var(--accent)}
button.plain{background:none;color:var(--accent);padding:8px 4px}
button.danger{background:none;color:var(--bad);padding:8px 4px}
button.full{width:100%}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:-.08px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.1px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
nav button .ic{line-height:0;height:22px}
nav button.on{color:var(--accent)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.big{font-family:var(--sf-rounded);font-size:36px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;letter-spacing:-.24px;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.steps{display:flex;gap:6px;margin:8px 0 4px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--gold)}
.mood{display:flex;justify-content:space-between}
.mood button{background:var(--bg);border:1px solid var(--line);font-size:24px;padding:8px 10px;color:inherit}
.mood button.on{border-color:var(--accent);background:var(--accent-soft)}
.cp{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cp:first-child{border-top:0}
.cp .n{width:22px;color:var(--muted);flex:none}
.cp.done{color:var(--muted);text-decoration:line-through}
.cp.cur{font-weight:600;color:var(--gold-ink)}
code{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-all}
.hidden{display:none}
button.google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
@media (prefers-color-scheme: dark){button.google{background:#fff;color:#1f1f1f}}
.switch{width:51px;height:31px;border-radius:99px;background:var(--line);padding:0;position:relative;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--good)} .switch.on i{left:22px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin:18px 0 4px}
.seg button{flex:1;background:none;color:var(--ink);padding:8px;border-radius:8px;font-size:15px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pw{position:relative} .pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);padding:8px}
.eye.on{color:var(--accent)}
.pwrules{list-style:none;padding:0;margin:10px 0 0;color:var(--muted)}
.pwrules li::before{content:'○ ';}
.pwrules li.ok{color:var(--good)} .pwrules li.ok::before{content:'✓ ';}
.footer-logo{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;margin:18px 0 4px}
.footer-logo svg{border-radius:7px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:-.08px;text-transform:uppercase;color:var(--muted)}
:root{--m-p:#2f6b6e;--m-c:#c19a4b;--m-f:#74557f}
@media (prefers-color-scheme: dark){:root{--m-p:#6bb8b6;--m-c:#ddbb72;--m-f:#b391c6}}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:none}
.legend{flex:1;min-width:0}
.lg{display:grid;grid-template-columns:12px 1fr auto 40px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px}
.lg .muted{text-align:right}
.alert{border-color:var(--warn)}
/* ===== landing (signed-out) ===== */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
body.landing-mode{--bg:#05070d;--card:rgba(255,255,255,.05);--ink:#f3efe6;--muted:rgba(243,239,230,.62);--line:rgba(255,255,255,.12);
  --accent:#e2c27e;--on-accent:#12141b;--accent-soft:rgba(226,194,126,.14);--gold:#e2c27e;--gold-ink:#ecd29b;--good:#7fd1a3;
  background:#05070d;padding:0;letter-spacing:-.2px}
body.landing-mode.no-webgl{background:radial-gradient(1200px 700px at 70% 10%,#26305a 0%,transparent 60%),radial-gradient(900px 600px at 10% 80%,#3a2f17 0%,transparent 55%),#05070d}
main{position:relative;z-index:1}
main.wide{max-width:1160px;padding:0 20px}
.landing{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--sf-display);font-weight:650;font-size:17px;letter-spacing:-.2px}
.brand svg{border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.topcta{color:var(--ink)!important;font-weight:600}
.hero2{display:grid;grid-template-columns:1fr;gap:34px;align-items:center;padding:7vh 0 8vh;min-height:calc(100vh - 70px)}
@media (min-width:900px){.hero2{grid-template-columns:1.15fr .85fr;gap:64px;padding:4vh 0}}
.eyebrow-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;color:var(--muted);font-weight:500}
.eyebrow-pill i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.display{font-family:var(--sf-display);font-weight:750;font-size:clamp(64px,15vw,132px);line-height:.92;letter-spacing:-.045em;margin:18px 0 0;
  background:linear-gradient(180deg,#fff 0%,#e9e4d8 55%,#b9b3a6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.display .dash{opacity:.55}
.display .gold,.gold{background:linear-gradient(100deg,#f6e2b0 0%,#d9b46a 45%,#f3d999 70%,#b98d43 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slogan2{font-family:var(--sf-display);font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.02em;margin:18px 0 0}
.lede{color:var(--muted);font-size:clamp(16px,1.6vw,19px);line-height:1.5;max-width:520px;margin:14px 0 0}
.stats-row{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.stats-row b{display:block;font-family:var(--sf-rounded);font-size:26px;font-weight:700;letter-spacing:-.01em}
.stats-row span{font-size:13px;color:var(--muted)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:24px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 30px 80px rgba(0,0,0,.45)}
.auth-card{padding:26px;display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;justify-self:center}
.auth-card h2{font-size:24px;margin:0;letter-spacing:-.02em}
.auth-card .muted.small{margin:0 0 8px}
.auth-card label{color:var(--muted)}
.landing input{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.14);color:var(--ink)}
.landing input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(226,194,126,.15)}
.landing input::placeholder{color:rgba(243,239,230,.35)}
.cta{background:linear-gradient(180deg,#f0d593,#d4ac5e);color:#14120c;font-weight:650;border-radius:14px;padding:14px 20px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px rgba(212,172,94,.25);transition:transform .15s ease,box-shadow .2s}
.cta:active{transform:scale(.98)}
.glass-btn{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 20px;font-weight:600}
.landing button.google{border-radius:14px;padding:14px 20px;border:0;font-weight:600}
.landing .seg{background:rgba(255,255,255,.07)}
.landing .seg button{color:var(--muted)}
.landing .seg button.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:4px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.center{text-align:center}
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:0 0 10px}
.section-title{font-family:var(--sf-display);font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:0 0 34px}
.features,.steps2{padding:9vh 0 2vh}
.feat-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:700px){.feat-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.feat-grid{grid-template-columns:1fr 1fr 1fr}}
.feat{padding:24px;border-radius:22px;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}
@media (hover:hover){.feat:hover{transform:translateY(-4px);border-color:rgba(226,194,126,.35)}}
.feat-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--gold);
  background:radial-gradient(circle at 30% 20%,rgba(226,194,126,.28),rgba(226,194,126,.06));border:1px solid rgba(226,194,126,.25);margin-bottom:16px}
.feat h3,.step h3{font-family:var(--sf-display);font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0 0 8px;color:var(--ink);text-transform:none}
.feat p,.step p{color:var(--muted);font-size:15px;line-height:1.5;margin:0}
.step-row{display:grid;grid-template-columns:1fr;gap:26px}
@media (min-width:800px){.step-row{grid-template-columns:repeat(3,1fr)}}
.step{border-top:1px solid var(--line);padding-top:20px}
.step .num{font-family:var(--sf-rounded);font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.06em;display:block;margin-bottom:12px}
.cta-band{margin:10vh 0 6vh;padding:clamp(32px,6vw,64px);text-align:center;border-radius:30px}
.cta-band h2{font-size:clamp(32px,6vw,60px);line-height:1.02;letter-spacing:-.04em;margin:0 0 26px;font-weight:750}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:26px 0 calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);color:var(--muted);font-size:13px;margin-top:auto}
.reveal{opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0s),filter .9s var(--d,0s)}
.reveal.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;filter:none;transition:none}.gold,.display .gold{animation:none}}
</style>

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main id="app"></main>
<nav id="nav" class="hidden"></nav>
<div id="toast" class="toast"></div>

<script src="firebase-config.js"></script>
<script>
'use strict';
/* ============ storage ============ */
const KEY = 'dailyos.v1';
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — storage full?'); } try{ markDirty(); }catch(e){} }
function fresh(){
  return {
    v:1, setupDone:false, welcomeSeen:false,
    profile:{
      name:'', age:'', sex:'male', heightCm:'', weightKg:'', activity:'1.375',
      wake:'06:30', sleep:'23:00', workStart:'09:30', workEnd:'18:30', workDays:[1,2,3,4,5],
      goals:{cyber:true, gym:true, food:true, money:true},
      cyberLevel:'beginner', trainDays:4, trainPlace:'gym', gymTime:'07:00',
      studyTime:'19:30', studyMins:45, bodyGoal:'recomp',
      diet:'nonveg', avoid:'',
      salary:'', bills:'', savingsTarget:'', currency:'INR', alsoCur:'', fxRate:'',
      briefMorning:'06:45', briefNight:'21:30'
    },
    ntfy:{ server:'https://ntfy.sh', topic: 'dailyos-' + rand(10) },
    days:{}, xp:0, streak:0, best:0, lastStreakDate:null,
    cyberDone:0, reminders:[], scheduled:{}
  };
}
if(!S) S = fresh();

/* ============ helpers ============ */
function rand(n){ const c='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; const a=new Uint32Array(n); crypto.getRandomValues(a); for(const x of a) s+=c[x%c.length]; return s; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function today(){ return new Date(); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function atTime(d, hhmm){ const [h,m]=hhmm.split(':').map(Number); const x=new Date(d); x.setHours(h,m,0,0); return x; }
function minus(hhmm, mins){ const [h,m]=hhmm.split(':').map(Number); let t=h*60+m-mins; t=(t+1440)%1440; return pad(Math.floor(t/60))+':'+pad(t%60); }
function fmt12(hhmm){ const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'pm':'am'; const hh=h%12||12; return hh+(m?':'+pad(m):'')+ap; }

const WORDNUM={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,half:0.5};
function r1(x){ return Math.round(x*10)/10; }
function parseFood(text){
  const parts=text.toLowerCase().split(/,|\+|\band\b|\bwith\b|&|\n/).map(s=>s.trim()).filter(Boolean);
  const items=[], unknown=[];
  for(const part of parts){
    const manual=part.match(/(\d+)\s*kcal/);
    if(manual){
      const g=(re)=>{ const m=part.match(re); return m?+m[1]:0; };
      items.push({label:part, kcal:+manual[1], p:g(/(\d+)\s*g?\s*(p|protein)\b/), c:g(/(\d+)\s*g?\s*(c|carbs?)\b/), f:g(/(\d+)\s*g?\s*(f|fat)\b/)});
      continue;
    }
    let best=null;
    for(const f of FOOD){ for(const k of f[0]){ if(new RegExp('\\b'+k+'\\b').test(part) && (!best || k.length>best.k.length)) best={f,k}; } }
    if(!best){ unknown.push(part); continue; }
    const [,kcal,p,c,fat,serv,lbl,unit]=best.f;
    let grams, label;
    const gm=part.match(/(\d+(?:\.\d+)?)\s*(g|gm|gms|gram|grams|ml|kg)\b/);
    if(gm){ grams=+gm[1]*(gm[2]==='kg'?1000:1); label=Math.round(grams)+(unit==='ml'?'ml ':'g ')+lbl.replace(/^(cup|bowl|plate|glass|slice|scoop|tbsp|tsp|pack) /,''); }
    else{
      let q=1; const n=part.match(/(\d+(?:\.\d+)?)/);
      if(n) q=+n[1]; else { for(const w in WORDNUM){ if(new RegExp('\\b'+w+'\\b').test(part)){ q=WORDNUM[w]; break; } } }
      if(q>=20){ grams=q; label=Math.round(q)+'g '+lbl; }   // "150 chicken" -> assume grams
      else { grams=q*serv; label=(q!==1?q+' × ':'')+lbl+' ('+Math.round(grams)+(unit==='ml'?'ml':'g')+')'; }
    }
    const m=grams/100;
    items.push({label, kcal:Math.round(kcal*m), p:r1(p*m), c:r1(c*m), f:r1(fat*m)});
  }
  return {items, unknown};
}
function sumFood(list){ return list.reduce((a,x)=>({k:a.k+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),f:a.f+(x.f||0)}),{k:0,p:0,c:0,f:0}); }
// Donut chart of where calories come from: protein & carbs 4 kcal/g, fat 9 kcal/g
function macroDonut(t, size=132){
  const parts=[['Protein',t.p*4,t.p,'var(--m-p)'],['Carbs',t.c*4,t.c,'var(--m-c)'],['Fat',t.f*9,t.f,'var(--m-f)']];
  const total=parts.reduce((a,x)=>a+x[1],0);
  const R=52, C=2*Math.PI*R; let off=0;
  const rings = total>0 ? parts.map(([n,kc,,col])=>{ const len=kc/total*C; const s=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`; off+=len; return s; }).join('')
    : `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"/>`;
  const legend=parts.map(([n,kc,g,col])=>`<div class="lg"><i style="background:${col}"></i><span>${n}</span><b>${Math.round(g)} g</b><span class="muted">${total?Math.round(kc/total*100):0}%</span></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 132 132" width="${size}" height="${size}" role="img" aria-label="Calories by macro">${rings}<text x="66" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)" style="font-family:var(--sf-rounded)">${Math.round(t.k)}</text><text x="66" y="82" text-anchor="middle" font-size="11" fill="var(--muted)">kcal</text></svg><div class="legend">${legend}</div></div>`;
}

/* ============ numbers: body & money ============ */
function body(){
  const p=S.profile, w=num(p.weightKg), h=num(p.heightCm), a=num(p.age)||25;
  if(!w||!h) return null;
  const bmi=w/((h/100)**2);
  const bmr=10*w+6.25*h-5*a+(p.sex==='female'?-161:5);
  const tdee=bmr*num(p.activity||1.375);
  const adj={bulk:300,cut:-400,recomp:0}[p.bodyGoal]||0;
  const kcal=Math.round((tdee+adj)/10)*10;
  const protein=Math.round(w*(p.bodyGoal==='cut'?2.0:1.8));
  const fat=Math.round(kcal*0.25/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  const cat=bmi<18.5?'Underweight':bmi<25?'Healthy':bmi<30?'Overweight':'Obese';
  return {bmi:Math.round(bmi*10)/10, cat, bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, protein, fat, carbs};
}
function money(ref=today()){
  const p=S.profile, sal=num(p.salary), bills=num(p.bills), save=num(p.savingsTarget);
  const spendable=Math.max(0,sal-bills-save);
  const dim=new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate();
  const daily=spendable/dim;
  let month=0, week=0, todaySpent=0;
  const mon=addDays(ref, -((ref.getDay()+6)%7)); const monK=dkey(mon), refK=dkey(ref);
  for(const k in S.days){
    const d=parseKey(k); const sum=(S.days[k].spend||[]).reduce((a,x)=>a+num(x.amt),0);
    if(d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth()) month+=sum;
    if(k>=monK && k<=refK) week+=sum;
    if(k===refK) todaySpent=sum;
  }
  const dayOfMonth=ref.getDate();
  return {sal,bills,save,spendable,daily,month,week,todaySpent,left:spendable-month,
    weekBudget:daily*7, weekLeft:daily*7-week, onPace: month <= daily*dayOfMonth,
    projectedSave: sal-bills-month - Math.max(0,(dim-dayOfMonth))*daily };
}

/* ============ daily plan ============ */
function planFor(d){
  const p=S.profile, b=body(), m=money(d), tasks=[];
  const add=(id,time,title,detail,xp,goal)=>tasks.push({id,time,title,detail,xp,goal});
  if(p.goals.food) add('breathe', p.wake, 'Wake up + 5-min breathing', 'Phone away. Breathe in 4s, out 6s.', 10, 'mind');
  const w=workoutFor(d);
  if(w) add('gym', p.gymTime, w.name+' day', w.ex.join('\n')+'\nBeat last week by 1 rep or 2.5kg.', 30, 'gym');
  if(p.goals.food){
    add('lunch','13:00','Mindful lunch, no screens', 'Idea: '+mealFor(d,1), 10, 'food');
    add('protein', minus(p.briefNight,30), 'Log food & hit protein', b?('Target: '+b.protein+'g protein · '+b.kcal+' kcal'):'Log what you ate', 15, 'food');
  }
  if(p.goals.cyber && S.cyberDone<ROADMAP.length) add('study', p.studyTime, 'Cybersec: '+p.studyMins+' min', currentCheckpoint().t, 25, 'cyber');
  if(p.goals.money) add('spend', minus(p.briefNight,25), "Log today's spending", m.daily?('Daily budget '+cur(m.daily)):'Log anything you spent', 5, 'money');
  add('checkin', minus(p.briefNight,15), 'Evening check-in', 'How did today go?', 15, 'mind');
  tasks.sort((a,b)=>a.time.localeCompare(b.time));
  return tasks;
}

/* ============ XP & streak ============ */
function level(){ return Math.floor(S.xp/200)+1; }
function shownStreak(){
  if(!S.lastStreakDate) return 0;
  const t=dkey(today()), y=dkey(addDays(today(),-1));
  return (S.lastStreakDate===t||S.lastStreakDate===y)?S.streak:0;
}
function completion(k){
  const tasks=planFor(parseKey(k)), dd=day(k);
  const done=tasks.filter(t=>dd.tasks[t.id]).length;
  return {done,total:tasks.length,pct:tasks.length?done/tasks.length:0};
}
function setTask(id, on, silent){
  const k=dkey(today()), dd=day(k);
  if(!!dd.tasks[id]===on) return;
  const t=planFor(today()).find(x=>x.id===id); const xp=t?t.xp:10;
  dd.tasks[id]=on; S.xp=Math.max(0,S.xp+(on?xp:-xp));
  if(on && !silent) toast('+'+xp+' XP');
  checkStreak(); save();
}
function checkStreak(){
  const k=dkey(today()); const c=completion(k);
  if(c.pct>=0.7 && S.lastStreakDate!==k){
    const y=dkey(addDays(today(),-1));
    S.streak = S.lastStreakDate===y ? S.streak+1 : 1;
    S.lastStreakDate=k; S.best=Math.max(S.best||0,S.streak); S.xp+=20;
    setTimeout(()=>toast('🔥 '+S.streak+'-day streak! +20 XP'),900);
  }
}

/* ============ reminders: quick-type parser ============ */
function parseReminder(input){
  let s=' '+input.trim().toLowerCase()+' ';
  const now=new Date(); let date=null, time=null, repeat=null, dow=null, dom=null, relative=null;
  const take=(re)=>{ const m=s.match(re); if(m){ s=s.replace(m[0],' '); } return m; };
  let m;
  if(m=take(/\bin\s+(\d+)\s*(minutes?|mins?|m|hours?|hrs?|h)\b/)){ relative=(+m[1])*(m[2].startsWith('h')?60:1); }
  if(take(/\b(every\s*day|daily|everyday)\b/)) repeat='daily';
  else if(take(/\b(every\s+weekday|weekdays)\b/)) repeat='weekdays';
  else if(take(/\b(every\s+month|monthly)\b/)) repeat='monthly';
  else if(m=take(/\bevery\s+(sun|mon|tue|wed|thu|fri|sat)(day|nesday|sday|urday|rsday)?\b/)){ repeat='weekly'; dow=DOWFULL.findIndex(x=>x.startsWith(m[1])); }
  else if(take(/\b(every\s+week|weekly)\b/)){ repeat='weekly'; dow=now.getDay(); }
  if(m=take(/\b(on\s+(the\s+)?)?(\d{1,2})(st|nd|rd|th)\b/)) dom=+m[3];
  if(m=take(/\b(at\s+)?(\d{1,2})(?::|\.)?(\d{2})?\s*(am|pm)\b/)){ let h=+m[2]%12; if(m[4]==='pm') h+=12; time=pad(h)+':'+pad(+(m[3]||0)); }
  else if(m=take(/\b(at\s+)?(\d{1,2})[:.](\d{2})\b/)){ time=pad(+m[2])+':'+m[3]; }
  else if(m=take(/\bat\s+(\d{1,2})\b/)){ let h=+m[1]; if(h<7) h+=12; time=pad(h)+':00'; }
  if(take(/\btonight\b/)){ date=dkey(now); time=time||'21:00'; }
  else if(take(/\bday after tomorrow\b/)) date=dkey(addDays(now,2));
  else if(take(/\b(tomorrow|tmrw|tmr|tomo)\b/)) date=dkey(addDays(now,1));
  else if(take(/\btoday\b/)) date=dkey(now);
  else if(!repeat && (m=take(/\b(on\s+|next\s+)?(sun|mon|tue|wed|thu|fri|sat)(day|nesday|sday|urday|rsday)?\b/))){
    const target=DOWFULL.findIndex(x=>x.startsWith(m[2])); let diff=(target-now.getDay()+7)%7; if(diff===0) diff=7; date=dkey(addDays(now,diff));
  }
  if(!time){ if(take(/\bmorning\b/)) time='08:00'; else if(take(/\b(noon|afternoon)\b/)) time='13:00'; else if(take(/\bevening\b/)) time='18:00'; else if(take(/\bnight\b/)) time='21:00'; }
  let title=s.replace(/\b(remind me to|remind me|to|on|at|the|every)\b(?=\s*$)/g,' ').replace(/^\s*(remind me to|remind me)\b/,' ').replace(/\s+/g,' ').trim();
  title=title.replace(/^(to|at|on)\s+/,'').replace(/\s+(to|at|on)$/,'');
  if(!title) return null;
  title=title[0].toUpperCase()+title.slice(1);
  const r={id:rand(8), title, repeat, created:Date.now()};
  if(relative!=null){ const t=new Date(now.getTime()+relative*60000); r.once=t.getTime(); return r; }
  r.time=time||'09:00';
  if(repeat==='monthly'){ r.dom=dom||now.getDate(); return r; }
  if(repeat==='weekly'){ r.dow=dow; return r; }
  if(repeat) return r;
  if(!date && dom){ let d=new Date(now.getFullYear(),now.getMonth(),dom); if(atTime(d,r.time)<now) d=new Date(now.getFullYear(),now.getMonth()+1,dom); date=dkey(d); }
  if(!date){ date=dkey(now); if(atTime(now,r.time)<now) date=dkey(addDays(now,1)); }
  r.once=atTime(parseKey(date),r.time).getTime();
  return r;
}
function occurrences(r, from, to){
  const out=[];
  if(r.once){ if(r.once>=from && r.once<=to) out.push(r.once); return out; }
  for(let d=new Date(from); d.getTime()<=to+86400000; d=addDays(d,1)){
    const t=atTime(d,r.time).getTime(); if(t<from||t>to) continue;
    const g=d.getDay();
    if(r.repeat==='daily' || (r.repeat==='weekdays'&&g>0&&g<6) || (r.repeat==='weekly'&&g===r.dow) || (r.repeat==='monthly'&&d.getDate()===r.dom)) out.push(t);
  }
  return out;
}
function nextOcc(r){ const o=occurrences(r, Date.now(), Date.now()+40*86400000); return o[0]; }
function describe(r){
  if(r.once){ const d=new Date(r.once); const k=dkey(d); const lbl=k===dkey(today())?'Today':k===dkey(addDays(today(),1))?'Tomorrow':DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; return lbl+' · '+fmt12(pad(d.getHours())+':'+pad(d.getMinutes())); }
  const t=fmt12(r.time);
  if(r.repeat==='daily') return 'Every day · '+t;
  if(r.repeat==='weekdays') return 'Weekdays · '+t;
  if(r.repeat==='weekly') return 'Every '+DOW[r.dow]+' · '+t;
  if(r.repeat==='monthly') return 'Monthly on the '+r.dom+(['th','st','nd','rd'][(r.dom%10<4&&Math.floor(r.dom/10)!==1)?r.dom%10:0])+' · '+t;
  return t;
}

/* ============ notifications via ntfy ============ */
const HORIZON_H=60;
function appUrl(){ return location.href.split('#')[0]; }
async function ntfySend(msg){
  if(!S.ntfy.topic) return false;
  const body={topic:S.ntfy.topic, title:msg.title, message:msg.message, tags:msg.tags||[], priority:msg.priority||3, click:appUrl()};
  if(msg.at) body.delay=String(Math.floor(msg.at/1000));
  try{
    // no Content-Type header => simple CORS request (no preflight); ntfy reads JSON posted to the root URL
    const res=await fetch(S.ntfy.server.replace(/\/$/,'')+'/', {method:'POST', body:JSON.stringify(body)});
    return res.ok;
  }catch(e){ return false; }
}
function plannedNotifications(){
  const p=S.profile, out=[], now=Date.now(), end=now+HORIZON_H*3600000;
  for(let i=0;i<=3;i++){
    const d=addDays(today(),i), k=dkey(d), plan=planFor(d), w=workoutFor(d), next=addDays(d,1), nplan=planFor(next), nw=workoutFor(next);
    const bits=(pl,wk,dd)=>{ const b=[]; if(wk) b.push('🏋️ '+wk.name+' '+fmt12(p.gymTime)); if(p.goals.cyber&&S.cyberDone<ROADMAP.length) b.push('💻 '+currentCheckpoint().t+' '+fmt12(p.studyTime)); b.push(pl.length+' tasks'); return b.join(' · '); };
    out.push({key:k+':morning', at:atTime(d,p.briefMorning).getTime(), title:'☀️ Good morning'+(p.name?', '+p.name:''), message:'Today: '+bits(plan,w,d)+'. Let\'s go.', tags:['sunny']});
    out.push({key:k+':night', at:atTime(d,p.briefNight).getTime(), title:'🌙 Heads-up for tomorrow', message:bits(nplan,nw,next)+'. Sleep by '+fmt12(p.sleep)+'.', tags:['crescent_moon']});
    if(w) out.push({key:k+':gym', at:atTime(d,minus(p.gymTime,10)).getTime(), title:'🏋️ '+w.name+' day in 10 min', message:'Get your shoes on. Streak is watching.', priority:4});
    if(p.goals.cyber&&S.cyberDone<ROADMAP.length) out.push({key:k+':study', at:atTime(d,p.studyTime).getTime(), title:'💻 Study time: '+p.studyMins+' min', message:currentCheckpoint().t, priority:4});
    if(p.goals.food) out.push({key:k+':lunch', at:atTime(d,'13:30').getTime(), title:'🍽️ Log lunch', message:'What did you eat? Takes 10 seconds.'});
    out.push({key:k+':nag1', at:atTime(d,'20:30').getTime(), title:'🔥 Streak check', message:'Anything left today? Tick it off before midnight.', priority:4});
    out.push({key:k+':nag2', at:atTime(d,'23:15').getTime(), title:'💀 Your streak dies at midnight', message:'If today\'s tasks aren\'t done, the streak resets. Open DailU-Os now.', priority:5, tags:['skull']});
  }
  for(const r of S.reminders){ for(const t of occurrences(r, now, end)) out.push({key:'r:'+r.id+':'+t, at:t, title:'⏰ '+r.title, message:describe(r), priority:4}); }
  return out.filter(n=>n.at>now+30000 && n.at<end);
}
let syncing=false;
async function syncNotifications(manual){
  if(syncing||!S.setupDone||!notifierOn()) return; syncing=true;
  // forget keys older than 4 days
  const cutoff=Date.now()-4*86400000; for(const k in S.scheduled) if(S.scheduled[k]<cutoff) delete S.scheduled[k];
  const todo=plannedNotifications().filter(n=>!S.scheduled[n.key]);
  let ok=0, fail=0; const snap=S;
  for(const n of todo){
    if(S!==snap) break;
    if(await ntfySend(n)){ S.scheduled[n.key]=n.at; ok++; save(); } else fail++;
    await new Promise(r=>setTimeout(r,250));
  }
  syncing=false;
  if(manual) toast(fail?('Scheduled '+ok+', '+fail+' failed — check connection'):(ok?'Scheduled '+ok+' notifications':'All notifications already scheduled'));
}

/* ============ accounts & sync (Firebase, optional) ============ */
// Data layout in Firestore:  users/{uid}/docs/core  and  users/{uid}/docs/m-YYYY-MM
// Each doc: { data: "<json>", updatedAt: <ms>, device: "<id>" }
let cloud=null;            // adapter {get(id), set(id,obj), list(), signIn..., signOut}
let user=null, cloudReady=false, pushT=null, pulling=false, lastSyncAt=0, authView=null;
const DEVICE = (()=>{ try{ let d=localStorage.getItem('dailyos.device'); if(!d){ d=rand(10); localStorage.setItem('dailyos.device',d); } return d; }catch(e){ return 'x'; } })();
function notifierOn(){ try{ return localStorage.getItem('dailyos.notifier')!=='0'; }catch(e){ return true; } }
function setNotifier(on){ try{ localStorage.setItem('dailyos.notifier', on?'1':'0'); }catch(e){} }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h>>>0); }
function syncMeta(){ if(!S._sync) S._sync={hash:{},ts:{},dirtyAt:{}}; return S._sync; }
function corePart(){ const {profile,ntfy,xp,streak,best,lastStreakDate,cyberDone,reminders,setupDone,v}=S; return {profile,ntfy,xp,streak,best,lastStreakDate,cyberDone,reminders,setupDone,v}; }
function parts(){
  const out={core:corePart()};
  for(const k in S.days){ const id='m-'+k.slice(0,7); (out[id]=out[id]||{})[k]=S.days[k]; }
  return out;
}
function rawSave(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function markDirty(){
  if(!user) return; const m=syncMeta(), now=Date.now(), ps=parts();
  for(const id in ps){ if(hashStr(JSON.stringify(ps[id]))!==m.hash[id] && !m.dirtyAt[id]) m.dirtyAt[id]=now; }
  if(!pushT) pushT=setTimeout(()=>{ pushT=null; pushAll(); }, 1500);
}
async function pushAll(){
  if(!user||!cloud) return; const m=syncMeta(), ps=parts();
  try{
    for(const id in ps){
      const json=JSON.stringify(ps[id]), h=hashStr(json);
      if(h===m.hash[id]) continue;
      const at=Date.now(); await cloud.set(id,{data:json, updatedAt:at, device:DEVICE});
      m.hash[id]=h; m.ts[id]=at; delete m.dirtyAt[id];
    }
    lastSyncAt=Date.now(); rawSave();
  }catch(e){ console.warn('push failed',e); }
}
function applyRemote(id, obj){
  const data=JSON.parse(obj.data);
  if(id==='core'){ Object.assign(S, data); }
  else { const ym=id.slice(2); for(const k of Object.keys(S.days)) if(k.startsWith(ym)) delete S.days[k]; Object.assign(S.days, data); }
  const m=syncMeta(); m.hash[id]=hashStr(obj.data); m.ts[id]=obj.updatedAt; delete m.dirtyAt[id];
}
// Pull newer cloud docs. On the very first sync of this device, ask which copy wins.
async function pullAll(first){
  if(!user||!cloud||pulling) return; pulling=true;
  try{
    const remote=await cloud.list(); const m=syncMeta();
    const hasRemote=!!remote.core;
    if(first && hasRemote && S.setupDone && m.ts.core===undefined){
      const useCloud=confirm('Your account already has DailU-Os data from another device.\n\nOK = use the account data on this device\nCancel = replace the account data with this device\'s data');
      if(useCloud){ const keepSched=S.scheduled; S.days={}; for(const id in remote) applyRemote(id, remote[id]); S.scheduled=keepSched||{}; setNotifier(false); }
      else { m.hash={}; m.ts={}; m.dirtyAt={}; rawSave(); pulling=false; await pushAll(); return; }
    } else if(first && hasRemote && !S.setupDone){
      S.days={}; for(const id in remote) applyRemote(id, remote[id]); if(!S.scheduled) S.scheduled={}; setNotifier(false);
    } else if(!hasRemote){
      pulling=false; await pushAll(); return;
    } else {
      for(const id in remote){
        const r=remote[id]; if(r.device===DEVICE && r.updatedAt<=(m.ts[id]||0)) continue;
        if(r.updatedAt>(m.ts[id]||0)){
          const dirty=m.dirtyAt[id];
          if(!dirty || r.updatedAt>dirty) applyRemote(id, r);
        }
      }
    }
    if(!S.scheduled) S.scheduled={};
    lastSyncAt=Date.now(); rawSave(); render();
    pulling=false; await pushAll();
  }catch(e){ console.warn('pull failed',e); toast('Sync failed — check connection'); }
  pulling=false;
}

const FB_VER='10.12.2';
async function cloudInit(){
  const cfg=window.DAILYOS_FIREBASE; if(!cfg||!cfg.apiKey) return;
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg), auth=Au.getAuth(app), db=F.getFirestore(app);
    const col=()=>F.collection(db,'users',user.uid,'docs');
    cloud={
      async list(){ const snap=await F.getDocs(col()); const out={}; snap.forEach(d=>out[d.id]=d.data()); return out; },
      async set(id,obj){ await F.setDoc(F.doc(db,'users',user.uid,'docs',id), obj); },
      async google(){
        const p=new Au.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
        try{ await Au.signInWithPopup(auth,p); }
        catch(e){ if(/popup|operation-not-supported|cancelled-popup/.test(e.code||'')) await Au.signInWithRedirect(auth,p); else throw e; }
      },
      emailIn:(e,pw)=>Au.signInWithEmailAndPassword(auth,e,pw),
      async emailUp(e,pw,name){
        const cred=await Au.createUserWithEmailAndPassword(auth,e,pw);
        try{ if(name) await Au.updateProfile(cred.user,{displayName:name}); }catch(_){}
        try{ await Au.sendEmailVerification(cred.user); }catch(_){}
        return cred;
      },
      reset:(e)=>Au.sendPasswordResetEmail(auth,e),
      signOut:()=>Au.signOut(auth)
    };
    Au.getRedirectResult(auth).catch(e=>toast(authMsg(e)));
    Au.onAuthStateChanged(auth, async u=>{
      const was=user; user=u; cloudReady=true;
      if(u){
        // a different person signed in on this device: start clean so data never mixes
        if(S._uid && S._uid!==u.uid){ S=fresh(); }
        S._uid=u.uid;
        if(!S.profile.name && (u.displayName||pendingName)) S.profile.name=(u.displayName||pendingName).split(' ')[0];
        S.welcomeSeen=true; authView=null; await pullAll(!was);
      }
      render();
    });
  }catch(e){ console.warn('Firebase failed to load',e); cloudReady=true; render(); }
}
function authMsg(e){
  const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Wrong email or password';
  if(c.includes('email-already-in-use')) return 'That email already has an account. Sign in instead.';
  if(c.includes('weak-password')) return 'Password needs at least 8 characters';
  if(c.includes('too-many-requests')) return 'Too many tries. Wait a few minutes and try again.';
  if(c.includes('invalid-email')) return 'That email looks wrong';
  if(c.includes('unauthorized-domain')) return 'This website isn\'t authorised in Firebase yet';
  if(c.includes('network')) return 'No internet connection';
  if(c.includes('api-key')) return 'Firebase key looks wrong — tell Claude';
  if(c.includes('configuration-not-found')||c.includes('operation-not-allowed')) return 'This sign-in method isn\'t switched on in Firebase yet';
  if(c.includes('popup-closed')||c.includes('cancelled')) return 'Sign-in cancelled';
  return 'Sign-in failed'+(c?' ('+c.replace('auth/','')+')':'');
}

/* ============ shader background (WebGL) ============ */
const Shader=(()=>{
  let cv=null, gl=null, prog=null, raf=0, t0=0, uR, uT, uM, mx=0, my=0, tmx=0, tmy=0, running=false;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FS=`precision highp float;uniform vec2 r;uniform float t;uniform vec2 m;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),u.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 R=mat2(.8,.6,-.6,.8);for(int i=0;i<5;i++){v+=a*n(p);p=R*p*2.02;a*=.5;}return v;}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);p+=m*.06;float T=t*.045;
  vec2 q=vec2(fbm(p*1.3+T),fbm(p*1.3-T+5.2));
  vec2 w=vec2(fbm(p*1.5+q*2.+vec2(1.7,9.2)+T*1.3),fbm(p*1.5+q*2.+vec2(8.3,2.8)-T));
  float f=fbm(p*1.15+w*2.1);
  vec3 c0=vec3(.024,.031,.058),c1=vec3(.094,.125,.235),c2=vec3(.19,.22,.42),gold=vec3(.86,.72,.44);
  vec3 col=mix(c0,c1,smoothstep(.15,.75,f));
  col=mix(col,c2,smoothstep(.5,.95,length(q))*.55);
  col+=gold*pow(smoothstep(.42,.92,f*w.x+.15),2.6)*.42;
  col+=gold*.10*smoothstep(1.1,.0,length(p-vec2(.75,-.55)))*(.6+.4*sin(T*6.));
  col+=vec3(.35,.3,.6)*pow(smoothstep(.6,1.,w.y),4.)*.18;
  float v=smoothstep(1.35,.2,length(p*vec2(.85,1.05)));col*=mix(.45,1.,v);
  col+=(h(gl_FragCoord.xy+fract(t*.37))-.5)*.04;
  gl_FragColor=vec4(col,1.);}`;
  function init(){
    cv=document.getElementById('bg'); if(!cv) return false;
    gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'}); if(!gl) return false;
    const sh=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
    try{ prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog); }catch(e){ console.warn(e); gl=null; return false; }
    gl.useProgram(prog);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    uR=gl.getUniformLocation(prog,'r'); uT=gl.getUniformLocation(prog,'t'); uM=gl.getUniformLocation(prog,'m');
    addEventListener('pointermove',e=>{ tmx=e.clientX/innerWidth-.5; tmy=.5-e.clientY/innerHeight; },{passive:true});
    addEventListener('resize',size); t0=performance.now()-20000*Math.random(); return true;
  }
  function size(){ if(!cv) return; const d=Math.min(devicePixelRatio||1,1.25); cv.width=Math.round(innerWidth*d); cv.height=Math.round(innerHeight*d); gl&&gl.viewport(0,0,cv.width,cv.height); }
  function frame(now){
    mx+=(tmx-mx)*.04; my+=(tmy-my)*.04;
    gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,(now-t0)/1000); gl.uniform2f(uM,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(running && !reduce) raf=requestAnimationFrame(frame);
  }
  return {
    start(){ if(running) return; if(!gl && !init()){ document.body.classList.add('no-webgl'); return; } running=true; cv.style.opacity='1'; size(); raf=requestAnimationFrame(frame); },
    stop(){ running=false; cancelAnimationFrame(raf); if(cv) cv.style.opacity='0'; }
  };
})();

app.addEventListener('click', e=>{ const s=e.target.closest('[data-scroll]'); if(s){ document.getElementById(s.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'center'}); } });

app.addEventListener('click', async e=>{
  const id=e.target.closest('button')?.id;
  if(id==='localOnly'){ S.welcomeSeen=true; save(); render(); }
  if(id==='emailSignIn'){ authView='signin'; render(); }
  if(id==='authBack'){ authView=null; render(); }
  if(id==='gSignIn'||id==='gSignIn2'){ try{ await cloud.google(); }catch(err){ toast(authMsg(err)); } }
  if(id==='emailSignIn2'){ authView='signin'; render(); }
  if(id==='forgotPw'){ const em=document.querySelector('#emailForm [name=email]').value.trim(); if(!em){ toast('Type your email first'); return; } try{ await cloud.reset(em); toast('Reset link sent to '+em); }catch(err){ toast(authMsg(err)); } }
  if(id==='syncNow'){ await pullAll(false); toast('Synced'); }
  if(id==='signOut' && confirm('Sign out?\n\nYour data is saved in your account and will be removed from this device until you sign in again.')){
    await pushAll(); await cloud.signOut(); user=null; S=fresh(); rawSave(); tab='today'; render();
  }
  if(id==='notifierToggle'){ setNotifier(!notifierOn()); if(notifierOn()) syncNotifications(true); render(); }
});
app.addEventListener('click', e=>{
  const t=e.target.closest('[data-auth]'); if(t){ authView=t.dataset.auth; render(); return; }
  const eye=e.target.closest('.eye'); if(eye){ const i=eye.previousElementSibling; i.type=i.type==='password'?'text':'password'; eye.classList.toggle('on', i.type==='text'); }
});
app.addEventListener('input', e=>{
  const f=e.target.form; if(!f||f.id!=='emailForm'||!f.password2) return;
  const pw=f.password.value, ok1=pw.length>=8, ok2=pw.length>0&&pw===f.password2.value;
  f.querySelector('[data-rule=len]').classList.toggle('ok',ok1); f.querySelector('[data-rule=match]').classList.toggle('ok',ok2);
});
app.addEventListener('submit', async e=>{
  if(e.target.id!=='emailForm') return; e.preventDefault();
  const f=e.target, up=authView==='signup', em=f.email.value.trim(), pw=f.password.value;
  if(!/^\S+@\S+\.\S+$/.test(em)){ toast('Enter a valid email'); return; }
  if(up){
    const name=f.name.value.trim();
    if(!name){ toast('Add your name'); return; }
    if(pw.length<8){ toast('Password needs at least 8 characters'); return; }
    if(pw!==f.password2.value){ toast('Passwords don\'t match'); return; }
    pendingName=name;
  } else if(!pw){ toast('Enter your password'); return; }
  const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent=up?'Creating account…':'Signing in…';
  try{
    if(up){ await cloud.emailUp(em,pw,pendingName); toast('Account created. Check your email to confirm it.'); }
    else await cloud.emailIn(em,pw);
  }catch(err){ toast(authMsg(err)); btn.disabled=false; btn.textContent=up?'Create account':'Sign in'; }
});
